<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Kati Sara — ניהול מחירון</title>
<style>
:root{--bg:#0e0b09;--ink:#f3ede2;--soft:#a79f92;--line:rgba(243,237,226,.14);--gold:#d2ab55;--gsoft:#e8cf94;--sans:-apple-system,BlinkMacSystemFont,'Heebo',system-ui,sans-serif;--serif:'Frank Ruhl Libre',serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding:40px 16px 80px}
.wrap{max-width:860px;margin:0 auto}
h1{font-family:var(--serif);font-size:30px;color:var(--gsoft);margin-bottom:6px}
.sub{color:var(--soft);font-size:14px;margin-bottom:26px}
.gate{display:grid;gap:12px;max-width:320px;margin:80px auto;text-align:center}
input{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:16px;outline:none;width:100%}
input:focus{border-color:var(--gold)}
button{cursor:pointer;border:0;border-radius:12px;padding:12px 26px;font-size:15px;font-family:var(--sans)}
.gold{background:linear-gradient(135deg,rgba(210,171,85,.35),rgba(210,171,85,.15));color:var(--gsoft);border:1px solid rgba(210,171,85,.4)}
.gold:hover{transform:translateY(-1px)}
.cat{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:16px 16px 8px;margin-bottom:16px;position:relative}
.cat h3{font-family:var(--serif);font-size:19px;color:var(--gsoft);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.cat h3 input{border-radius:8px;padding:6px 10px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 90px 90px 34px;gap:8px;margin-bottom:8px;align-items:center}
.row input{text-align:center}
.row input.pname-input{text-align:right}
.row .del{background:rgba(220,80,80,.15);color:#e28a8a;border-radius:10px;padding:6px 0;font-size:16px}
.row .pval{display:flex;gap:4px;align-items:center;justify-content:center;color:var(--soft);font-size:12px}
.addrow{width:100%;background:rgba(210,171,85,.12);color:var(--gsoft);margin-bottom:6px}
.addcat{background:rgba(255,255,255,.08);color:var(--ink);width:100%;margin-top:6px}
.bar{position:sticky;bottom:0;inset-inline-start:0;z-index:5;display:flex;gap:10px;justify-content:center;padding:18px 0;background:linear-gradient(transparent,var(--bg) 35%)}
.bar button{min-width:150px}
.msg{position:fixed;top:14px;inset-inline-start:50%;transform:translateX(-50%);background:#1d2;border-radius:12px;padding:10px 20px;color:#04210a;font-size:14px;font-weight:600;opacity:0;transition:.4s;pointer-events:none}
.msg.show{opacity:1}
.msg.err{background:#e28a8a;color:#210a04}
del{color:var(--soft)}
@media(max-width:560px){.row{grid-template-columns:1fr 64px 64px 30px}}
</style>
</head>
<body>
<div class="wrap">
<h1>ניהול המחירון — Kati Sara</h1>
<div class="sub">שינויים נשמרים לאתר בלחיצת "שמור" — זמינים באתר מיד.</div>

<div class="gate" id="gate">
<div>🔒 הזן סיסמת ניהול</div>
<input type="password" id="pass" placeholder="סיסמה" autocomplete="off">
<button class="gold" onclick="unlock()">התחברות</button>
<div class="msg" id="msg"></div>
</div>

<div id="editor" style="display:none">
<div id="cats"></div>
<button class="addcat" onclick="addCat()">+ הוספת קטגוריה</button>
<div class="bar">
<button class="gold" onclick="save()">💾 שמור ופרסם באתר</button>
<button onclick="location.reload()">ביטול שינויים</button>
</div>
</div>
</div>
<script>
let groups = [];
let pass = sessionStorage.getItem('ks_pass') || '';

function toast(m, err){
const el = document.getElementById('msg');
el.textContent = m; el.className = 'msg show' + (err ? ' err' : '');
setTimeout(() => el.className = 'msg' + (err ? ' err' : ''), 2200);
}

async function unlock(){
pass = document.getElementById('pass').value.trim();
const r = await fetch('/api/prices', { method: 'POST', headers: {'x-admin-pass': pass}, body: '{"groups":null}' });
if (r.status === 401) { toast('סיסמה שגויה', true); return; }
sessionStorage.setItem('ks_pass', pass);
document.getElementById('gate').style.display = 'none';
document.getElementById('editor').style.display = 'block';
await load();
}

async function load(){
const r = await fetch('/api/prices');
const d = await r.json();
groups = (d.groups || JSON.parse(localStorage.getItem('ks_seed') || 'null') || []);
render();
}

function el(tag, attrs = {}, children = []){
const e = document.createElement(tag);
for (const [k, v] of Object.entries(attrs)) e[k] = v;
children.forEach(c => e.appendChild(c));
return e;
}
const input = (value, oninput, cls = '') => {
const i = document.createElement('input');
i.value = value == null ? '' : value;
if (cls) i.className = cls;
i.addEventListener('input', oninput);
return i;
};

function render(){
const wrap = document.getElementById('cats');
wrap.innerHTML = '';
groups.forEach((g, gi) => {
const card = el('div', { className: 'cat' });
const title = el('h3');
title.appendChild(input(g.category, e => g.category = e.target.value));
const delCat = el('button', { textContent: '×', title: 'מחק קטגוריה', className: 'del' });
delCat.style.marginInlineStart = 'auto';
delCat.onclick = () => { groups.splice(gi, 1); render(); };
title.appendChild(delCat);
card.appendChild(title);
(g.items || []).forEach((it, ii) => {
const row = el('div', { className: 'row' });
row.appendChild(input(it.name, e => it.name = e.target.value, 'pname-input'));
const from = input(it.from, e => it.from = e.target.value.replace(/[^0-9]/g, '')); from.placeholder = 'מ';
row.appendChild(from);
const to = input(it.to, e => it.to = e.target.value.replace(/[^0-9]/g, '')); to.placeholder = 'עד';
row.appendChild(to);
const del = el('button', { textContent: '×', title: 'מחק', className: 'del' });
del.onclick = () => { g.items.splice(ii, 1); render(); };
row.appendChild(del);
card.appendChild(row);
});
const add = el('button', { textContent: '+ שורה', className: 'addrow' });
add.onclick = () => { g.items.push({ name: 'שם טיפול', from: 0 }); render(); };
card.appendChild(add);
wrap.appendChild(card);
});
}

function addCat(){ groups.push({ category: 'קטגורה חדשה', items: [] }); render(); }

async function save(){
const clean = groups.map(g => ({
category: g.category,
items: (g.items || [])
.filter(it => (it.name || '').trim() !== '')
.map(it => ({ name: it.name,
from: it.from === '' ? null : Number(it.from),
...(it.to ? { to: Number(it.to) } : {}) }))
}));
const r = await fetch('/api/prices', {
method: 'POST',
headers: { 'content-type': 'application/json', 'x-admin-pass': pass },
body: JSON.stringify({ groups: clean })
});
if (r.ok) toast('נשמר ✓ זמין באתר מיד');
else if (r.status === 401) toast('סיסמה שגויה — נתקלת בעיה, התחברות מחדש', true);
else toast('שגיאה בשמירה ' + r.status, true);
window.ksSaved = clean;
}

if (pass) {
document.getElementById('pass').value = pass;
setTimeout(unlock, 50);
}
</script>
</body>
</html>
