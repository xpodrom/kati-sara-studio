<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Kati Sara — ניהול תוכן</title>
<style>
:root{--bg:#0e0b09;--ink:#f3ede2;--soft:#a79f92;--line:rgba(243,237,226,.14);--gold:#d2ab55;--gsoft:#e8cf94;--sans:-apple-system,BlinkMacSystemFont,'Heebo',system-ui,sans-serif;--serif:'Frank Ruhl Libre',serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;padding:40px 16px 90px}
.wrap{max-width:960px;margin:0 auto}
h1{font-family:var(--serif);font-size:30px;color:var(--gsoft);margin-bottom:8px}
.sub{color:var(--soft);font-size:14px;margin-bottom:22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tab{background:rgba(255,255,255,.06);color:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 18px;font-family:var(--sans);font-size:14px;cursor:pointer}
.tab.on{background:rgba(210,171,85,.22);color:var(--gsoft);border-color:rgba(210,171,85,.4)}
.panel{display:none;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:18px 18px 10px;margin-bottom:12px}
.panel.on{display:block}
input,textarea{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14.5px;font-family:var(--sans);outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--gold)}
label{display:block;color:var(--gsoft);font-size:13px;margin:12px 0 4px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 18px;font-size:14px;font-family:var(--sans)}
.gold{background:linear-gradient(135deg,rgba(210,171,85,.35),rgba(210,171,85,.15));color:var(--gsoft);border:1px solid rgba(210,171,85,.4)}
.gold:hover{transform:translateY(-1px)}
.mini{background:rgba(255,255,255,.08);color:var(--ink);padding:6px 12px}
.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h4{font-size:14px;color:var(--gsoft);margin-bottom:6px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.row3{display:grid;grid-template-columns:1fr 90px 90px 32px;gap:6px;margin-bottom:6px;align-items:center}
.row3 input{text-align:center}
.row3 input.pname{text-align:right}
.del{background:rgba(220,80,80,.15);color:#e28a8a;border-radius:8px;padding:6px 0;font-size:15px}
.add{width:100%;background:rgba(210,171,85,.12);color:var(--gsoft);margin:6px 0}
.bar{position:sticky;bottom:0;left:0;right:0;display:flex;gap:10px;justify-content:center;padding:14px 0;background:linear-gradient(transparent,var(--bg) 38%);z-index:5}
.bar button{min-width:150px}
.msg{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#25d366;border-radius:12px;padding:10px 20px;color:#04210a;font-size:14px;font-weight:600;opacity:0;transition:.4s;pointer-events:none;z-index:9}
.msg.show{opacity:1}
.msg.err{background:#e28a8a;color:#210a04}
.thumb{max-width:130px;max-height:130px;border-radius:12px;border:1px solid var(--line);display:block;margin-bottom:6px}
@media(max-width:560px){.row3{grid-template-columns:1fr 66px 66px 28px}}
</style>
</head>
<body>
<div class="wrap">
<h1>ניהול Kati Sara</h1>
<div class="sub">כל התוכן של האתר במקום אחד — הכל נשמר ומופיע מיד באתר בלחיצת "שמור".</div>

<div id="gate" style="display:grid;gap:12px;max-width:320px;margin:80px auto;text-align:center">
<div>🔒 הזן סיסמת ניהול</div>
<input type="password" id="pass" placeholder="סיסמה" autocomplete="off">
<button class="gold" onclick="unlock()">התחברות</button>
</div>

<div id="editor" style="display:none">
<div class="tabs" id="tabs">
<button class="tab on" data-t="biz">🏢 הגדרות עסק</button>
<button class="tab" data-t="texts">📝 טקסטים</button>
<button class="tab" data-t="services">📋 שירותים</button>
<button class="tab" data-t="frames">🎞️ פריימים + תמונות</button>
<button class="tab" data-t="journey">🛤️ הדרך שלנו</button>
<button class="tab" data-t="prices">💰 מחירון</button>
</div>

<div class="panel on" id="p_biz">
<label>טלפון — מוחל בכל מקום באתר (כפתורים, tel:, איילנד)</label><input id="b_phone" style="direction:ltr" placeholder="0538247102">
<label>וואטסאפ — טקסס פתיחה</label><textarea id="b_wa_text"></textarea>
<label>אינסטגרם 1 — כתובת מלאה</label><input id="b_ig1" style="direction:ltr">
<label>אינסטגרם 2 — כתובת מלאה (ריק = להסתיר)</label><input id="b_ig2" style="direction:ltr">
<label>פייסבוק — כתובת מלאה (ריק = להסתיר)</label><input id="b_fb" style="direction:ltr">
<label>Waze — קישור מלא (כולל קואורדינטות & navigate=yes)</label><input id="b_waze" style="direction:ltr">
<label>טקסט Waze</label><input id="b_waze_label">
</div>

<div class="panel" id="p_texts">
<label>פתיח עמוד ראשי — kicker</label><input id="t_hero_kicker">
<label>פתיח עמוד ראשי — חלק מודגש</label><textarea id="t_hero_sub_bold"></textarea>
<label>פתיח עמוד ראשי — שאר הטקסט</label><textarea id="t_hero_sub_rest"></textarea>
<label>Kicker — העבודה שלך</label><input id="t_work_kicker">
<label>כותרת ראשית של מסך העבודות</label><textarea id="t_work_title"></textarea>
<label>Kicker — המחירון</label><input id="t_prices_kicker">
<label>מחירון — תיאור</label><textarea id="t_prices_sub"></textarea>
<label>כתובת (מתחת לכפתור)</label><input id="t_address">
<label>Footer שמאל</label><input id="t_footer_left">
<label>Footer ימין</label><input id="t_footer_right">
<label>Kicker — סיום</label><input id="t_final_kicker">
<label>כותרת סיום</label><input id="t_final_title">
<label>תיאור פריימים</label><textarea id="t_frames_sub"></textarea>
<label>Kicker — פריימים</label><input id="t_frames_kicker">
<label>Kicker — הדרך שלנו</label><input id="t_journey_kicker">
<label>תיאור הדרך</label><textarea id="t_journey_sub"></textarea>
</div>

<div class="panel" id="p_services">
<div id="services"></div>
<button class="add" onclick="svcAddRow()">+ שירות חדש</button>
</div>

<div class="panel" id="p_frames">
<div id="frames"></div>
<button class="add" onclick="frAdd()">+ פריים חדש</button>
</div>

<div class="panel" id="p_journey">
<div id="journey"></div>
<button class="add" onclick="jrAdd()">+ שלב חדש</button>
</div>

<div class="panel" id="p_prices">
<div id="prices"></div>
<button class="add" onclick="prAddCat()">+ קטגוריה חדשה</button>
<label style="margin-top:18px">הערות שמוצגות במחירון</label>
<div id="disc"></div>
<button class="add" onclick="dAdd()">+ הערה חדשה</button>
</div>

<div class="bar">
<button class="gold" onclick="save()">💾 שמור ופרסם באתר</button>
<button onclick="location.reload()">ביטול שינויים</button>
</div>
</div>
</div>
<div class="msg" id="msg"></div>

<script>
let C = { groups: [], texts: {}, biz: {}, services: [], frames: [], journey: [], disclaimers: [] };
let pass = sessionStorage.getItem('ks_pass') || '';

const DEFSVC = [
  { name: 'גבות בשיטת הפודרה', desc: 'גוון מדויק, מהמם ושפיר' },
  { name: 'איפור קבוע — שפתיים', desc: 'צבע פנימי רך, בלי שפת-מכחול' },
  { name: 'למינציה לריסים', desc: 'הריסים שלך. מורמים, פתוחים, עובדים חודשים' },
  { name: 'הסרת איפור קבוע', desc: 'בלייזר או ברמובר, בתהליך מבוקר' }
];
const DEFJR = [
  { num: '01', title: 'שיחת היכרות', desc: 'סגנון, גוון, ציפיות ותוצאה צפויה — לפני שמתחילים כלים.' },
  { num: '02', title: 'שרטוט מדויק', desc: 'קונטור ממדד לפי זווית, צורה ותווית הפנים שלך.' },
  { num: '03', title: 'הטיפול', desc: 'הרדמה מקומית, כלים סטריליים חד-פעמיים, מהלך שקט ומבוקר.' },
  { num: '04', title: 'מעקב', desc: 'טיפול שני לפי הצורך, ריפיל שנה, והנחיות בית.' }
];
const DEFCAP = ['גבות פודרה · לפני / אחרי', 'למינציה · פריים חי', 'איפור קבוע · שפתיים', 'קעקוע קוסמטי', 'מבט כללי', 'פריים שישי'];
const DEFDISC = [
  'המחירים לטיפולי איפור קבוע הם לטיפול אחד בלבד, ובמידת הצורך ניתן לקבל טיפול שני להדגשה עד חודשיים מהטיפול הראשון.',
  'כל המחירים ניתנים לשינוי על ידי בעלת העסק על פי שיקול דעתה בכל עת.',
  'בשירותי איפור מקצועי ועיצוב שיער המחיר אינו כולל הגעה לבית הלקוח.',
  'ברכישת חבילת הסרה בלייזר או ברמובר בעלת העסק תוכל לשלב את שתי שיטות הטיפול עפ שיקול דעתה המקצועי.'
];
const DEFBIZ = {
  phone: '0538247102',
  wa_text: 'שלום, אני מעוניין בפרטים על טיפול...',
  ig1: 'https://www.instagram.com/kati_sara_beauty_artist/',
  ig2: 'https://www.instagram.com/kati_sara_makeup_artist/',
  fb: 'https://www.facebook.com/share/1FMhsmJD55/',
  waze: 'https://waze.com/ul?ll=31.6903642%2C34.5783461&navigate=yes&zoom=17',
  waze_label: 'ניווט לסטודיו ב-Waze'
};
const DEFAULTS_TEXTS = {
  hero_kicker: 'סטודיו לאיפור קבוע · אשקלון',
  hero_sub_bold: 'איפור קבוע · גבות ושפתיים בשיטת הפודרה · למינציה לריסים · הסרת איפור קבוע.',
  hero_sub_rest: ' סטודיו באשקלון שעובד לפי עקרון אחד: הפרצוף שלך הוא לא תרגיל — הוא הסרט, ואנחנו הצלמים.',
  work_kicker: 'העבודה שלך',
  work_title: 'מה שקורה כאן,\nאין שני לו.',
  prices_kicker: 'המחירון',
  prices_sub: 'הרשימה המלאה כפי שמופיעה בסטודיו — מחירי התחלה ("מ-"), והרבה טיפולים בטווח לפי מורכבות ואורך שיער. המחיר הסופי נקבע תמיד בשיחה לפני הטיפול, ובלי הפתעות במכשיר.',
  address: 'בלפור 31, אשקלון · קבלת פניות בטלפון',
  footer_right: 'הופק בסטודיו K·S · אשקלון',
  footer_left: '© 2026 KATI SARA — אשקלון',
  final_kicker: 'מחכים לך',
  final_title: 'הפריים הבא — שלך.',
  final_ord: 'KATI SARA · ASHKELON · PERMANENT BEAUTY',
  frames_sub: 'כל פריים יהיה עבודה אמיתית מהסטודיו — לפני ואחרי, בלי פילטרים שממציאים תוצאות. המקומות כבר מוכנים.',
  frames_kicker: 'הפריימים שלנו',
  journey_kicker: 'הדרך שלנו',
  journey_sub: 'סגנון, גוון, ציפיות ותוצאה צפויה — לפני שמתחילים כלים.'
};

function toast(m, err){
const el = document.getElementById('msg');
el.textContent = m; el.className = 'msg show' + (err ? ' err' : '');
setTimeout(() => el.className = 'msg' + (err ? ' err' : ''), 2200);
}

async function unlock(){
pass = document.getElementById('pass').value.trim();
const r = await fetch('/api/content', { method: 'POST', headers: { 'x-admin-pass': pass }, body: JSON.stringify({ probe: true }) });
if (r.status === 401) { toast('סיסמה שגויה', true); return; }
sessionStorage.setItem('ks_pass', pass);
document.getElementById('gate').style.display = 'none';
document.getElementById('editor').style.display = 'block';
await load();
}

async function load(){
const d = await (await fetch('/api/content')).json();
C = Object.assign({}, d || {});
C.texts = Object.assign({}, DEFAULTS_TEXTS, d.texts || {});
delete C.texts.phone;
C.biz = Object.assign({}, DEFBIZ, d.biz || {});
if ((d.texts || {}).phone && !(d.biz || {}).phone) C.biz.phone = d.texts.phone; // legacy migrate
C.groups = Array.isArray(d.groups) && d.groups.length ? d.groups : [];
if (!C.groups.length) { try { C.groups = (await (await fetch('/api/prices')).json()).groups || []; } catch (e) {} }
C.services = Array.isArray(d.services) && d.services.length ? d.services : DEFSVC.slice();
C.journey = Array.isArray(d.journey) && d.journey.length ? d.journey : DEFJR.slice();
C.disclaimers = Array.isArray(d.disclaimers) && d.disclaimers.length ? d.disclaimers : DEFDISC.slice();
C.frames = Array.isArray(d.frames) && d.frames.length ? d.frames : DEFCAP.map((cap, i) => ({ cap, img: 'frame' + (i + 1) }));
render();
}

const el = (tag, attrs = {}, children = []) => {
const e = document.createElement(tag);
for (const [k, v] of Object.entries(attrs)) e[k] = v;
children.forEach(c => e.appendChild(c));
return e;
};
const inp = (value, oninput) => { const i = document.createElement('input'); i.value = value == null ? '' : value; i.addEventListener('input', oninput); return i; };
const ta_ = (value, oninput, rows = 2) => { const i = document.createElement('textarea'); i.value = value == null ? '' : value; i.rows = rows; i.addEventListener('input', oninput); return i; };
const lbl = (t) => el('span', { textContent: t, className: 'label' });

function render(){
// biz
[['b_phone','phone'],['b_wa_text','wa_text'],['b_ig1','ig1'],['b_ig2','ig2'],['b_fb','fb'],['b_waze','waze'],['b_waze_label','waze_label']].forEach(([id, k]) => {
  const e = document.getElementById(id);
  e.value = C.biz[k] || '';
  e.oninput = ev => C.biz[k] = ev.target.value;
});
// texts
const map = { t_hero_kicker:'hero_kicker', t_hero_sub_bold:'hero_sub_bold', t_hero_sub_rest:'hero_sub_rest',
 t_work_kicker:'work_kicker', t_work_title:'work_title', t_prices_kicker:'prices_kicker', t_prices_sub:'prices_sub',
 t_address:'address', t_footer_left:'footer_left', t_footer_right:'footer_right',
 t_final_kicker:'final_kicker', t_final_title:'final_title', t_frames_sub:'frames_sub', t_frames_kicker:'frames_kicker',
 t_journey_kicker:'journey_kicker', t_journey_sub:'journey_sub' };
Object.entries(map).forEach(([id, key]) => {
  const e = document.getElementById(id);
  e.value = C.texts[key] || '';
  e.oninput = ev => C.texts[key] = ev.target.value;
});
// services
const sw = document.getElementById('services'); sw.innerHTML = '';
C.services.forEach((s, i) => {
  const card = el('div', { className: 'card' });
  card.appendChild(el('h4', {}, [el('span', { textContent: 'שירות ' + (i + 1) }),
    (() => { const b = el('button', { textContent: '×', className: 'del' }); b.onclick = () => { C.services.splice(i, 1); render(); }; return b; })()]));
  card.appendChild(lbl('שם השירות'));
  card.appendChild(inp(s.name, e => s.name = e.target.value));
  card.appendChild(lbl('תיאור קצר שיוצג באתר'));
  card.appendChild(inp(s.desc, e => s.desc = e.target.value));
  sw.appendChild(card);
});
// frames
const fw = document.getElementById('frames'); fw.innerHTML = '';
C.frames.forEach((f, i) => {
  const card = el('div', { className: 'card' });
  card.appendChild(el('h4', {}, [el('span', { textContent: 'פריים ' + (i + 1) }), (() => { const b = el('button', { textContent: '×', className: 'del' }); b.onclick = () => { C.frames.splice(i, 1); render(); }; return b; })()]));
  card.appendChild(lbl('כיתוב שיוצג על הפריים'));
  card.appendChild(inp(f.cap, e => f.cap = e.target.value));
  if (f.img) {
    const img = document.createElement('img');
    img.src = '/api/img/' + encodeURIComponent(f.img) + '?v=' + Date.now();
    img.className = 'thumb';
    img.onerror = () => img.remove();
    card.appendChild(img);
  }
  card.appendChild(lbl('העלאת תמונה (JPG·PNG): '));
  const file = document.createElement('input');
  file.type = 'file'; file.accept = 'image/*';
  file.onchange = ev => uploadFrame(i, ev.target.files[0]);
  card.appendChild(file);
  const rm = el('button', { textContent: '🗑 הסר תמונה', className: 'mini', style: 'margin-top:6px' });
  rm.onclick = () => removeImage(f.img);
  card.appendChild(rm);
  fw.appendChild(card);
});
// journey
const jw = document.getElementById('journey'); jw.innerHTML = '';
C.journey.forEach((j, i) => {
  const card = el('div', { className: 'card' });
  card.appendChild(el('h4', {}, [el('span', { textContent: 'שלב ' + (i + 1) }), (() => { const b = el('button', { textContent: '×', className: 'del' }); b.onclick = () => { C.journey.splice(i, 1); render(); }; return b; })()]));
  const r = el('div', { style: 'display:grid;grid-template-columns:70px 1fr;gap:6px' });
  r.appendChild(inp(j.num, e => j.num = e.target.value));
  r.appendChild(inp(j.title, e => j.title = e.target.value));
  card.appendChild(r);
  card.appendChild(ta_(j.desc, e => j.desc = e.target.value));
  jw.appendChild(card);
});
// prices
const pw = document.getElementById('prices'); pw.innerHTML = '';
C.groups.forEach((g, gi) => {
  const card = el('div', { className: 'card' });
  const head = el('div', { style: 'display:flex;gap:8px;align-items:center;margin-bottom:10px' });
  head.appendChild(inp(g.category, e => g.category = e.target.value));
  const delCat = el('button', { textContent: '×', className: 'del', title: 'מחק קטגוריה' });
  delCat.onclick = () => { C.groups.splice(gi, 1); render(); };
  head.appendChild(delCat);
  card.appendChild(head);
  (g.items || []).forEach((it, ii) => {
    const row = el('div', { className: 'row3' });
    row.appendChild(inp(it.name, e => it.name = e.target.value, 'pname'));
    row.appendChild(inp(it.from, e => it.from = e.target.value.replace(/[^0-9]/g, '')));
    const to = inp(it.to, e => it.to = e.target.value.replace(/[^0-9]/g, '')); to.placeholder = 'עד';
    row.appendChild(to);
    const d = el('button', { textContent: '×', className: 'del' });
    d.onclick = () => { g.items.splice(ii, 1); render(); };
    row.appendChild(d);
    card.appendChild(row);
  });
  const add = el('button', { textContent: '+ שורה', className: 'add' });
  add.onclick = () => { g.items.push({ name: 'שם טיפול', from: 0 }); render(); };
  card.appendChild(add);
  pw.appendChild(card);
});
// disclaimers
const dw = document.getElementById('disc'); dw.innerHTML = '';
C.disclaimers.forEach((d, i) => {
  const row = el('div', { style: 'display:grid;grid-template-columns:1fr 32px;gap:6px;margin-bottom:6px' });
  row.appendChild(ta_(d, e => C.disclaimers[i] = e.target.value, 1));
  const del = el('button', { textContent: '×', className: 'del' });
  del.onclick = () => { C.disclaimers.splice(i, 1); render(); };
  row.appendChild(del);
  dw.appendChild(row);
});
}

async function uploadFrame(i, file){
if (!file) return;
const f = C.frames[i];
const b64 = await new Promise(res => {
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]);
  r.readAsDataURL(file);
});
const mime = file.type || 'image/jpeg';
const r = await fetch('/api/img/' + encodeURIComponent(f.img), {
  method: 'POST',
  headers: { 'x-admin-pass': pass, 'content-type': 'application/json' },
  body: JSON.stringify({ mime, b64 })
});
toast(r.ok ? 'התמונה נשמרה ✓' : 'שגיאת העלאה ' + r.status, !r.ok);
render();
}

async function removeImage(key){
if (!key) return;
const r = await fetch('/api/img/' + encodeURIComponent(key), {
  method: 'POST',
  headers: { 'x-admin-pass': pass, 'content-type': 'application/json' },
  body: JSON.stringify({ mime: 'image/jpeg', b64: '' })
});
toast(r.ok ? 'התמונה הוסרה' : 'שגיאה', !r.ok);
render();
}

function svcAddRow(){ C.services.push({ name: 'שם שירות', desc: 'תיאור' }); render(); }
function frAdd(){ C.frames.push({ cap: 'תיאור פריים', img: 'frame' + (C.frames.length + 1) }); render(); }
function jrAdd(){ C.journey.push({ num: '0' + (C.journey.length + 1), title: 'שלב', desc: '' }); render(); }
function prAddCat(){ C.groups.push({ category: 'קטגוריה חדשה', items: [] }); render(); }
function dAdd(){ C.disclaimers.push('הערה חדשה'); render(); }

async function save(){
const cleanGroups = C.groups.map(g => ({
category: g.category,
items: (g.items || [])
.filter(it => (it.name || '').trim() !== '')
.map(it => ({ name: it.name,
from: it.from === '' ? null : Number(it.from),
...(it.to ? { to: Number(it.to) } : {}) }))
}));
delete (C.texts || {}).phone;
const payload = Object.assign({}, C, { groups: cleanGroups });
const r = await fetch('/api/content', {
method: 'POST',
headers: { 'content-type': 'application/json', 'x-admin-pass': pass },
body: JSON.stringify(payload)
});
if (r.ok) toast('נשמר ✓ האתר מציג את הגרסה החדשה');
else if (r.status === 401) toast('סיסמה שגויה', true);
else toast('שגיאת שמירה ' + r.status, true);
}

// tabs
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b));
document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p_' + b.dataset.t));
});

if (pass) {
document.getElementById('pass').value = pass;
setTimeout(unlock, 50);
}
</script>
